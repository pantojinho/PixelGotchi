name: Release
# Enviar uma tag v* (ex.: git tag v0.1.0 && git push origin v0.1.0) compila o
# firmware, monta o pacote (tools/package_release.py) e publica a release com
# as notas de docs/releases/<tag>.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build firmware and package
        run: python tools/package_release.py "${GITHUB_REF_NAME}"
      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then echo "Faltam as notas: $notes" >&2; exit 1; fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: PixelGotchi ${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
          files: |
            dist/PixelGotchi-${{ github.ref_name }}.zip
            dist/PixelGotchi-${{ github.ref_name }}/firmware/PixelGotchi-${{ github.ref_name }}-esp32s3-4MB-merged.bin
            dist/PixelGotchi-${{ github.ref_name }}/firmware/firmware.bin
            dist/PixelGotchi-${{ github.ref_name }}/SHA256SUMS.txt
