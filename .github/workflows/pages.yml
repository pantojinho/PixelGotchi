name: Publish web preview and USB installer
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that GitHub Pages is enabled
        id: pages-check
        shell: bash
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Pages is not enabled yet. In repository Settings → Pages, choose GitHub Actions, then run this workflow once from Actions.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-check.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
        if: steps.pages-check.outputs.enabled == 'true'
      - name: Build current ESP32-S3 firmware and installer image
        if: steps.pages-check.outputs.enabled == 'true'
        run: |
          python -m platformio run -e esp32-s3-matrix
          mkdir -p dist/pages
          cp -R preview/. dist/pages/
          python tools/build_web_installer.py --output dist/pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages-check.outputs.enabled == 'true'
