name: Publish web preview and USB installer
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build current ESP32-S3 firmware and installer image
        run: |
          # Gera a arte antes de copiar: o simulador publicado usa o mesmo art.js do firmware.
          python tools/gen_art.py
          mkdir -p dist/pages
          cp -R preview/. dist/pages/
          python tools/build_web_installer.py --output dist/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Configure Pages (Settings → Pages → GitHub Actions must be enabled)
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
