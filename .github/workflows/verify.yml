name: Verify firmware and controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.2.0
      - name: Generate and check shared artwork
        run: |
          python tools/gen_art.py
          git diff --exit-code -- src/art/ArtData.h src/art/ArtData.cpp src/art/LedProfile.h preview/art.js
      - name: Test real C++ controls with simulated hardware
        run: python tools/test_controls.py
      - name: Test preview and installer regressions
        run: |
          node test/test_preview.cjs
          node --experimental-vm-modules test/test_installer.cjs
          python -m unittest discover -s test -p test_web_installer.py
      - name: Build ESP32-S3 firmware
        run: python -m platformio run
