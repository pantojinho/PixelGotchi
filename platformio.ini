; PixelGochi — bichinho virtual pixel art para a Waveshare ESP32-S3-Matrix
; https://docs.waveshare.com/ESP32-S3-Matrix

[env:esp32-s3-matrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-S3FH4R2: 4MB flash embutida, 2MB PSRAM embutida
board_build.flash_size = 4MB
board_build.partitions = default.csv

; A placa usa o USB nativo do ESP32-S3 (sem chip USB-serial dedicado),
; então o monitor serial exige USB-CDC habilitado no boot.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit NeoMatrix @ ^1.3.3
    lewisxhe/SensorLib @ ^0.5.0
