; PixelGochi — bichinho virtual pixel art para a Waveshare ESP32-S3-Matrix
; https://docs.waveshare.com/ESP32-S3-Matrix

[env:esp32-s3-matrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/pio_gen_art.py

; ESP32-S3FH4R2: 4MB flash embutida, 2MB PSRAM embutida.
; O board "esp32-s3-devkitc-1" genérico assume 8MB por padrão; sem este
; override o esptool grava um cabeçalho de imagem "8MB" num chip de 4MB
; e o boot trava com "Detected size(4096k) smaller than... Probe failed".
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; A placa usa o USB nativo do ESP32-S3 (sem chip USB-serial dedicado),
; então o monitor serial exige USB-CDC habilitado no boot.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; Pinado numa versão antiga e madura de propósito: versões recentes
    ; (3.10.x) caíram no driver "genérico" por software pro ESP32-S3 no
    ; nosso teste, e esse driver não desliga interrupções durante o
    ; envio -- qualquer jitter corrompe o timing do WS2812B e os LEDs
    ; tendem a "estourar" pra branco no máximo (foi o que aconteceu e
    ; esquentou a placa). 3.6.0 tem suporte de hardware (RMT) maduro
    ; pro ESP32-S3.
    fastled/FastLED @ 3.6.0
    lewisxhe/SensorLib @ ^0.5.0
